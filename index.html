  <script>
    // 防闪烁：HTML 解析阶段即应用已保存的主题（localStorage 键与 src/store/theme.ts 一致）
    (function () {
      try {
        var t = localStorage.getItem("anime-calendar.theme.v1");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>
