name: deploy

on:
  schedule:
    # UTC 0 11,23 = 北京时间（Asia/Shanghai）07:00 / 19:00
    - cron: "0 11,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CI 数据回写产生的 bot 提交（[skip ci]）不应再次触发部署，防止循环
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Sync data（四平台抓取 + 清洗 + 写 data/updates.json）
        timeout-minutes: 25
        run: node scripts/sync.mjs

      - name: Verify today data（防复发：今天无条目时告警）
        run: |
          if grep -q "警告：今天" data/updates.json; then
            echo "::warning::今天数据缺失告警：请核查抓取器星期 tab/日期映射（爱奇艺「今天」/优酷「今」）"
          else
            echo "today data ok"
          fi

      - name: Verify data fields（总集数/更新规则覆盖，不足时告警）
        run: node scripts/verify/data-fields.mjs

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Commit data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json data/history.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): sync updates [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
